services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kost-api
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/kost/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

networks:
  shared-net:
    external: true